<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriFeed: Fact-Checked Intelligence</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .header { background: #1e293b; padding: 20px 40px; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 1.8rem; color: #38bdf8; }
        .header p { color: #94a3b8; margin-top: 4px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; }
        input[type="text"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 1rem; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        .sources-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 8px; }
        .source-btn { padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; cursor: pointer; text-align: center; transition: all 0.2s; }
        .source-btn.selected { background: #0c4a6e; border-color: #38bdf8; color: #38bdf8; }
        .submit-btn { width: 100%; padding: 14px; background: #0284c7; border: none; border-radius: 8px; color: white; font-size: 1rem; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
        .submit-btn:hover { background: #0369a1; }
        .submit-btn:disabled { background: #334155; cursor: not-allowed; }
        .loader { text-align: center; padding: 40px; color: #38bdf8; display: none; }
        .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat { background: #0f172a; border-radius: 8px; padding: 16px; text-align: center; border: 1px solid #334155; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #38bdf8; }
        .stat-label { color: #64748b; font-size: 0.85rem; margin-top: 4px; }
        .report { background: #0f172a; border-radius: 8px; padding: 20px; white-space: pre-wrap; line-height: 1.8; border: 1px solid #334155; }
        .article-card { background: #0f172a; border-radius: 8px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
        .article-title { font-weight: bold; color: #e2e8f0; margin-bottom: 6px; }
        .article-meta { display: flex; gap: 12px; margin-bottom: 8px; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
        .badge.High { background: #064e3b; color: #34d399; }
        .badge.Medium { background: #1c1917; color: #d97706; }
        .badge.Low { background: #1f2937; color: #9ca3af; }
        .article-summary { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; }
        .article-url { margin-top: 8px; }
        .article-url a { color: #38bdf8; font-size: 0.85rem; text-decoration: none; }
        .result-section { display: none; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; border: 1px solid #334155; color: #94a3b8; background: transparent; }
        .tab.active { background: #0284c7; border-color: #0284c7; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📰 NewsBot</h1>
        <p>Multi-Agent News Aggregator powered by LangGraph + GPT</p>
    </div>

    <div class="container">
        <div class="card">
            <div style="margin-bottom: 16px;">
                <label>Topic or Question</label>
                <input type="text" id="topic" placeholder="e.g. AI breakthroughs, US elections, climate change..." />
            </div>
            <div>
                <label>Select News Sources</label>
                <div class="sources-grid" id="sourcesGrid">
                    {% for source in sources %}
                    <div class="source-btn" onclick="toggleSource(this, '{{ source }}')">{{ source }}</div>
                    {% endfor %}
                </div>
            </div>
            <button class="submit-btn" onclick="runResearch()" id="submitBtn">🔍 Research News</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Agents are working... Fetching → Deduplicating → Summarizing → Presenting</p>
        </div>

        <div class="result-section" id="results">
            <div class="card">
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="statFetched">0</div>
                        <div class="stat-label">Articles Fetched</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="statDedup">0</div>
                        <div class="stat-label">After Dedup</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="statSummaries">0</div>
                        <div class="stat-label">Summarized</div>
                    </div>
                </div>

                <div class="tabs">
                    <button class="tab active" onclick="switchTab('report')">📋 Report</button>
                    <button class="tab" onclick="switchTab('articles')">📰 Articles</button>
                </div>

                <div class="tab-content active" id="tab-report">
                    <div class="report" id="report"></div>
                </div>
                <div class="tab-content" id="tab-articles">
                    <div id="articlesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedSources = [];

        function toggleSource(el, source) {
            if (el.classList.contains('selected')) {
                el.classList.remove('selected');
                selectedSources = selectedSources.filter(s => s !== source);
            } else {
                el.classList.add('selected');
                selectedSources.push(source);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');
        }

        async function runResearch() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) return alert('Please enter a topic');
            if (selectedSources.length === 0) return alert('Please select at least one source');

            document.getElementById('loader').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;

            try {
                const res = await fetch('/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, sources: selectedSources })
                });
                const data = await res.json();

                document.getElementById('statFetched').textContent = data.total_fetched;
                document.getElementById('statDedup').textContent = data.after_dedup;
                document.getElementById('statSummaries').textContent = data.summaries.length;
                document.getElementById('report').textContent = data.report;

                const articlesList = document.getElementById('articlesList');
                articlesList.innerHTML = data.summaries.map(s => `
                    <div class="article-card">
                        <div class="article-title">${s.title}</div>
                        <div class="article-meta">
                            <span class="badge ${s.relevance}">${s.relevance} Relevance</span>
                            <span style="color:#64748b;font-size:0.8rem">${s.source}</span>
                        </div>
                        <div class="article-summary">${s.summary}</div>
                        <div class="article-url"><a href="${s.url}" target="_blank">Read full article →</a></div>
                    </div>
                `).join('');

                document.getElementById('results').style.display = 'block';
            } catch (err) {
                alert('Something went wrong: ' + err.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
